[profile.default]
src = "src"
out = "out"
libs = ["lib"]
optimizer = true
optimizer_runs = 200
via_ir = true
evm_version = "prague"

[rpc_endpoints]
arc_mainnet = "${ARC_RPC_URL}"

[etherscan]
arc_mainnet = { key = "noverify", url = "https://explorer.arc.io/api" }

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options
